<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lug'at Topshiruvchi Barabani</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background: #090d16;
      background-image:
        radial-gradient(at 10% 10%, rgba(139, 92, 246, 0.25) 0px, transparent 50%),
        radial-gradient(at 90% 90%, rgba(236, 72, 153, 0.2) 0px, transparent 50%),
        radial-gradient(at 50% 50%, rgba(15, 23, 42, 0.8) 0px, transparent 100%);
      background-attachment: fixed;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
      overflow-x: hidden;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }

    header h1 {
      font-size: 2.2rem;
      font-weight: 800;
      background: linear-gradient(135deg, #c084fc, #e879f9, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
      letter-spacing: -0.5px;
    }

    header p {
      color: #94a3b8;
      font-size: 0.95rem;
    }

    .main-container {
      display: flex;
      flex-wrap: wrap;
      gap: 32px;
      justify-content: center;
      align-items: flex-start;
      max-width: 1300px;
      width: 100%;
    }

    /* Glassmorphism umumiy klassi */
    .glass-card {
      background: rgba(30, 41, 59, 0.45);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      box-shadow: 0 16px 32px 0 rgba(0, 0, 0, 0.37);
    }

    /* Baraban Bo'limi */
    .wheel-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .wheel-wrapper {
      position: relative;
      width: 500px;
      height: 500px;
      margin-bottom: 20px;
      padding: 10px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 0 40px rgba(139, 92, 246, 0.15);
    }

    @media (max-width: 580px) {
      .wheel-wrapper {
        width: 320px;
        height: 320px;
      }
    }

    .pointer {
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 18px solid transparent;
      border-right: 18px solid transparent;
      border-top: 32px solid #f43f5e;
      z-index: 10;
      filter: drop-shadow(0 4px 10px rgba(244, 63, 94, 0.6));
    }

    canvas {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      will-change: transform;
    }

    .spin-btn-center {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate3d(-50%, -50%, 0);
      width: 86px;
      height: 86px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ec4899, #8b5cf6);
      border: 3px solid rgba(255, 255, 255, 0.8);
      color: white;
      font-weight: 800;
      font-size: 1rem;
      letter-spacing: 0.5px;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(236, 72, 153, 0.5);
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      user-select: none;
      z-index: 5;
    }

    .spin-btn-center:hover {
      transform: translate3d(-50%, -50%, 0) scale(1.08);
      box-shadow: 0 0 35px rgba(236, 72, 153, 0.8);
    }

    .spin-btn-center:active {
      transform: translate3d(-50%, -50%, 0) scale(0.95);
    }

    .spin-btn-center:disabled {
      background: rgba(51, 65, 85, 0.8);
      border-color: rgba(255, 255, 255, 0.2);
      cursor: not-allowed;
      box-shadow: none;
    }

    /* Yon Panellar */
    .side-panels {
      display: flex;
      flex-direction: column;
      gap: 20px;
      width: 380px;
      max-width: 100%;
    }

    .card {
      padding: 20px;
    }

    .card-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: #f1f5f9;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .badge {
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.3);
      font-size: 0.78rem;
      padding: 3px 10px;
      border-radius: 12px;
      font-weight: 600;
    }

    .input-group {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }

    input[type="text"] {
      flex: 1;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      padding: 10px 14px;
      color: white;
      font-size: 0.92rem;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
    }

    input[type="text"]:focus {
      border-color: #a855f7;
      background: rgba(15, 23, 42, 0.8);
    }

    .btn {
      background: linear-gradient(135deg, #8b5cf6, #6366f1);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 10px 16px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }

    .btn:hover {
      opacity: 0.9;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .name-list {
      max-height: 160px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-right: 4px;
    }

    .name-list::-webkit-scrollbar, .stat-box::-webkit-scrollbar {
      width: 5px;
    }
    .name-list::-webkit-scrollbar-thumb, .stat-box::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 4px;
    }

    .name-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 23, 42, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.88rem;
    }

    .delete-btn {
      color: #f43f5e;
      cursor: pointer;
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 4px;
      transition: background 0.2s;
    }

    .delete-btn:hover {
      background: rgba(244, 63, 94, 0.2);
    }

    /* Stat panellar */
    .stats-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .stat-box {
      background: rgba(15, 23, 42, 0.5);
      border-radius: 12px;
      padding: 12px;
      max-height: 180px;
      overflow-y: auto;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .stat-box.yodlagan {
      border-top: 3px solid #22c55e;
    }

    .stat-box.yodlamagan {
      border-top: 3px solid #f43f5e;
    }

    .stat-header {
      font-size: 0.82rem;
      font-weight: 700;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .stat-box.yodlagan .stat-header { color: #4ade80; }
    .stat-box.yodlamagan .stat-header { color: #fb7185; }

    .stat-list {
      list-style: none;
      font-size: 0.85rem;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .stat-list li {
      background: rgba(30, 41, 59, 0.6);
      padding: 5px 8px;
      border-radius: 6px;
      word-break: break-all;
      border: 1px solid rgba(255, 255, 255, 0.03);
    }

    /* Modal (Glassmorphism Modal) */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(9, 13, 22, 0.75);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: all;
    }

    .modal {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 24px;
      padding: 32px 24px;
      width: 90%;
      max-width: 420px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      transform: scale(0.9) translate3d(0, 0, 0);
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .modal-overlay.active .modal {
      transform: scale(1) translate3d(0, 0, 0);
    }

    .modal h2 {
      color: #94a3b8;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      margin-bottom: 6px;
    }

    .winner-name {
      font-size: 2.2rem;
      font-weight: 800;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 12px 0 24px 0;
      word-break: break-all;
    }

    .modal-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .modal-btn {
      padding: 12px 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.92rem;
      transition: transform 0.1s, opacity 0.2s, background 0.2s;
    }

    .modal-btn:hover {
      opacity: 0.95;
    }

    .modal-btn:active {
      transform: scale(0.98);
    }

    .btn-yodlagan {
      background: linear-gradient(135deg, #16a34a, #15803d);
      color: white;
      box-shadow: 0 4px 12px rgba(22, 163, 74, 0.3);
    }

    .btn-yodlamagan {
      background: linear-gradient(135deg, #dc2626, #b91c1c);
      color: white;
      box-shadow: 0 4px 12px rgba(220, 38, 38, 0.3);
    }

    .btn-bekor {
      background: rgba(51, 65, 85, 0.8);
      color: #e2e8f0;
    }
  </style>
</head>
<body>

  <header>
    <h1>Lug'at Topshiruvchi Barabani</h1>
    <p>Ismlarni kiriting, barabanni aylantiring va natijani belgilang!</p>
  </header>

  <div class="main-container">

    <!-- Baraban -->
    <div class="wheel-section">
      <div class="wheel-wrapper">
        <div class="pointer"></div>
        <canvas id="wheelCanvas" width="500" height="500"></canvas>
        <button id="spinBtn" class="spin-btn-center">AYLANTIR</button>
      </div>
    </div>

    <!-- Yon Boshqaruv Paneli -->
    <div class="side-panels">

      <!-- Ismlar kiritish -->
      <div class="card glass-card">
        <div class="card-title">
          Ismlar Ro'yxati
          <span id="nameCount" class="badge">0 ta ism</span>
        </div>
        <div class="input-group">
          <input type="text" id="nameInput" placeholder="Yangi ism kiriting..." onkeydown="if(event.key==='Enter') addName()">
          <button class="btn" onclick="addName()">+ Qo'shish</button>
        </div>
        <div id="nameList" class="name-list"></div>
      </div>

      <!-- Natijalar / Statistika -->
      <div class="card glass-card">
        <div class="card-title">Natijalar</div>
        <div class="stats-container">

          <div class="stat-box yodlagan">
            <div class="stat-header">
              <span>Yodlaganlar</span>
              <span id="countYodlagan">0</span>
            </div>
            <ul id="listYodlagan" class="stat-list"></ul>
          </div>

          <div class="stat-box yodlamagan">
            <div class="stat-header">
              <span>Yodlamaganlar</span>
              <span id="countYodlamagan">0</span>
            </div>
            <ul id="listYodlamagan" class="stat-list"></ul>
          </div>

        </div>
      </div>

    </div>

  </div>

  <!-- Modal Natija Oynasi -->
  <div id="resultModal" class="modal-overlay">
    <div class="modal">
      <h2>Keyingi lug'at topshiruvchisi:</h2>
      <div id="winnerDisplay" class="winner-name">...</div>

      <div class="modal-actions">
        <button class="modal-btn btn-yodlagan" onclick="handleResult('yodlagan')">
          ✅ Yodlagan (Chiqarib tashlash)
        </button>
        <button class="modal-btn btn-yodlamagan" onclick="handleResult('yodlamagan')">
          ❌ Yodlamagan (Chiqarib tashlash)
        </button>
        <button class="modal-btn btn-bekor" onclick="handleResult('bekor')">
          ↩️ Bekor qilish (Barabanda qolsin)
        </button>
      </div>
    </div>
  </div>

  <script>
    const colors = [
      '#ef4444', '#f97316', '#f59e0b', '#10b981',
      '#06b6d4', '#3b82f6', '#8b5cf6', '#ec4899',
      '#14b8a6', '#6366f1', '#a855f7', '#84cc16'
    ];

    let names = [];
    let yodlaganlar = [];
    let yodlamaganlar = [];

    let currentAngle = 0;
    let isSpinning = false;
    let selectedIndex = null;

    const canvas = document.getElementById('wheelCanvas');
    const ctx = canvas.getContext('2d', { alpha: true });

    // Zaif noutbuklar uchun Offscreen Off-render Cache
    const offCanvas = document.createElement('canvas');
    offCanvas.width = 500;
    offCanvas.height = 500;
    const offCtx = offCanvas.getContext('2d');

    const spinBtn = document.getElementById('spinBtn');
    const nameInput = document.getElementById('nameInput');
    const nameListEl = document.getElementById('nameList');
    const nameCountEl = document.getElementById('nameCount');
    const resultModal = document.getElementById('resultModal');
    const winnerDisplay = document.getElementById('winnerDisplay');

    // Web Audio API (Lazy / Cached)
    let audioCtx = null;
    function playClickSound() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(380, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(120, audioCtx.currentTime + 0.04);
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.04);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.04);
    }

    function addName() {
      const val = nameInput.value.trim();
      if (val) {
        names.push(val);
        nameInput.value = '';
        updateUI();
      }
    }

    function removeName(index) {
      names.splice(index, 1);
      updateUI();
    }

    function updateUI() {
      nameCountEl.textContent = `${names.length} ta ism`;
      nameListEl.innerHTML = '';

      names.forEach((name, idx) => {
        const item = document.createElement('div');
        item.className = 'name-item';
        item.innerHTML = `
          <span>${name}</span>
          <span class="delete-btn" onclick="removeName(${idx})">&times;</span>
        `;
        nameListEl.appendChild(item);
      });

      renderWheelToCache();
      drawWheelFromCache();
    }

    // Barabanni Offscreen canvas'ga bir marta chizib keshlab qo'yish
    function renderWheelToCache() {
      const numSegments = names.length;
      const radius = offCanvas.width / 2;
      offCtx.clearRect(0, 0, offCanvas.width, offCanvas.height);

      if (numSegments === 0) {
        offCtx.save();
        offCtx.beginPath();
        offCtx.arc(radius, radius, radius - 10, 0, 2 * Math.PI);
        offCtx.fillStyle = 'rgba(15, 23, 42, 0.8)';
        offCtx.fill();
        offCtx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
        offCtx.lineWidth = 3;
        offCtx.stroke();

        offCtx.fillStyle = '#64748b';
        offCtx.font = '600 16px Inter, sans-serif';
        offCtx.textAlign = 'center';
        offCtx.textBaseline = 'middle';
        offCtx.fillText("Ismlar kiritilmagan", radius, radius);
        offCtx.restore();
        return;
      }

      const anglePerSegment = (2 * Math.PI) / numSegments;

      for (let i = 0; i < numSegments; i++) {
        const angle = i * anglePerSegment;

        offCtx.beginPath();
        offCtx.moveTo(radius, radius);
        offCtx.arc(radius, radius, radius - 5, angle, angle + anglePerSegment);
        offCtx.fillStyle = colors[i % colors.length];
        offCtx.fill();
        offCtx.strokeStyle = '#090d16';
        offCtx.lineWidth = 3;
        offCtx.stroke();

        // Matn chizish
        offCtx.save();
        offCtx.translate(radius, radius);
        offCtx.rotate(angle + anglePerSegment / 2);
        offCtx.textAlign = 'right';
        offCtx.fillStyle = '#ffffff';
        offCtx.font = '700 15px Inter, sans-serif';
        offCtx.shadowColor = 'rgba(0,0,0,0.5)';
        offCtx.shadowBlur = 4;

        let text = names[i];
        if (text.length > 13) text = text.substring(0, 11) + '...';

        offCtx.fillText(text, radius - 28, 5);
        offCtx.restore();
      }
    }

    // Animatsiya paytida faqat rasmni burchakka ko'ra aylantirish (Protsessorga yengil)
    function drawWheelFromCache() {
      const radius = canvas.width / 2;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.save();
      ctx.translate(radius, radius);
      ctx.rotate(currentAngle);
      ctx.drawImage(offCanvas, -radius, -radius);
      ctx.restore();
    }

    spinBtn.addEventListener('click', spinWheel);

    function spinWheel() {
      if (isSpinning || names.length === 0) return;
      isSpinning = true;
      spinBtn.disabled = true;

      // Akmal tekshiruvi (Case-insensitive)
      const nonAkmalIndices = [];
      names.forEach((n, idx) => {
        if (n.trim().toLowerCase() !== 'akmal') {
          nonAkmalIndices.push(idx);
        }
      });

      // Agar boshqa ismlar bo'lsa, Akmal tanlanmaydi
      if (nonAkmalIndices.length > 0) {
        const randIdx = Math.floor(Math.random() * nonAkmalIndices.length);
        selectedIndex = nonAkmalIndices[randIdx];
      } else {
        selectedIndex = Math.floor(Math.random() * names.length);
      }

      const numSegments = names.length;
      const anglePerSegment = (2 * Math.PI) / numSegments;

      const targetSegmentAngle = 1.5 * Math.PI - (selectedIndex + 0.5) * anglePerSegment;
      const fullRotations = 5 + Math.floor(Math.random() * 3);
      const finalAngle = fullRotations * 2 * Math.PI + targetSegmentAngle;

      const startAngle = currentAngle % (2 * Math.PI);
      const totalRotation = finalAngle - startAngle;

      const duration = 4800;
      const startTime = performance.now();
      let lastSoundSegment = -1;

      function animate(now) {
        const elapsed = now - startTime;
        const progress = Math.min(elapsed / duration, 1);

        // Silliq sekinlashish formulasi (Ease Out Quart)
        const easeOut = 1 - Math.pow(1 - progress, 4);

        currentAngle = startAngle + totalRotation * easeOut;
        drawWheelFromCache();

        // Ovoz berish
        const currentSegment = Math.floor((((1.5 * Math.PI - currentAngle) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI)) / anglePerSegment);
        if (currentSegment !== lastSoundSegment) {
          playClickSound();
          lastSoundSegment = currentSegment;
        }

        if (progress < 1) {
          requestAnimationFrame(animate);
        } else {
          isSpinning = false;
          spinBtn.disabled = false;
          showResult(names[selectedIndex]);
        }
      }

      requestAnimationFrame(animate);
    }

    function showResult(winner) {
      winnerDisplay.textContent = winner;
      resultModal.classList.add('active');

      confetti({
        particleCount: 80,
        spread: 60,
        origin: { y: 0.6 },
        disableForReducedMotion: true
      });
    }

    function handleResult(action) {
      if (selectedIndex === null) return;
      const winnerName = names[selectedIndex];

      if (action === 'yodlagan') {
        yodlaganlar.push(winnerName);
        names.splice(selectedIndex, 1);
      } else if (action === 'yodlamagan') {
        yodlamaganlar.push(winnerName);
        names.splice(selectedIndex, 1);
      }

      resultModal.classList.remove('active');
      selectedIndex = null;

      updateStatsUI();
      updateUI();
    }

    function updateStatsUI() {
      document.getElementById('countYodlagan').textContent = yodlaganlar.length;
      const listYod = document.getElementById('listYodlagan');
      listYod.innerHTML = '';
      yodlaganlar.forEach(n => {
        const li = document.createElement('li');
        li.textContent = n;
        listYod.appendChild(li);
      });

      document.getElementById('countYodlamagan').textContent = yodlamaganlar.length;
      const listYodla = document.getElementById('listYodlamagan');
      listYodla.innerHTML = '';
      yodlamaganlar.forEach(n => {
        const li = document.createElement('li');
        li.textContent = n;
        listYodla.appendChild(li);
      });
    }

    updateUI();
  </script>
</body>
</html>
