<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lug'at Topshiruvchi Barabani</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background: #050510;
      background-image: 
        radial-gradient(circle at 15% 10%, rgba(139, 92, 246, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 85% 85%, rgba(236, 72, 153, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 50% 50%, rgba(15, 23, 42, 0.95) 0%, transparent 100%);
      background-attachment: fixed;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 16px;
      overflow-x: hidden;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
      z-index: 2;
    }

    header h1 {
      font-size: 2.5rem;
      font-weight: 800;
      background: linear-gradient(135deg, #d8b4fe, #f0abfc, #7dd3fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
      text-shadow: 0 0 20px rgba(216, 180, 254, 0.2);
    }

    header p {
      color: #94a3b8;
      font-size: 1rem;
      font-weight: 400;
    }

    .main-container {
      display: flex;
      flex-wrap: wrap;
      gap: 40px;
      justify-content: center;
      align-items: flex-start;
      max-width: 1200px;
      width: 100%;
      z-index: 2;
    }

    /* Glassmorphism umumiy klassi - Shaffoflik oshirildi */
    .glass-card {
      background: rgba(20, 25, 40, 0.25);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 24px;
      box-shadow: 0 20px 40px 0 rgba(0, 0, 0, 0.4), inset 0 0 0 1px rgba(255, 255, 255, 0.05);
    }

    /* Baraban Bo'limi */
    .wheel-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .wheel-wrapper {
      position: relative;
      width: 520px;
      height: 520px;
      margin-bottom: 20px;
      padding: 12px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.02);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.05);
      box-shadow: 0 0 50px rgba(139, 92, 246, 0.1);
    }

    @media (max-width: 600px) {
      .wheel-wrapper {
        width: 340px;
        height: 340px;
      }
    }

    .pointer {
      position: absolute;
      top: -15px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 20px solid transparent;
      border-right: 20px solid transparent;
      border-top: 36px solid #f43f5e;
      z-index: 10;
      filter: drop-shadow(0 4px 12px rgba(244, 63, 94, 0.7));
    }

    canvas {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      will-change: transform;
    }

    .spin-btn-center {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate3d(-50%, -50%, 0);
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ec4899, #8b5cf6);
      border: 4px solid rgba(25, 30, 45, 0.9);
      color: white;
      font-weight: 800;
      font-size: 1.05rem;
      letter-spacing: 0.5px;
      cursor: pointer;
      box-shadow: 0 0 30px rgba(236, 72, 153, 0.6), inset 0 0 10px rgba(255,255,255,0.3);
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      user-select: none;
      z-index: 5;
    }

    .spin-btn-center:hover {
      transform: translate3d(-50%, -50%, 0) scale(1.1);
      box-shadow: 0 0 45px rgba(236, 72, 153, 0.9);
    }

    .spin-btn-center:active {
      transform: translate3d(-50%, -50%, 0) scale(0.95);
    }

    .spin-btn-center:disabled {
      background: rgba(30, 41, 59, 0.8);
      color: rgba(255,255,255,0.4);
      border-color: rgba(255, 255, 255, 0.1);
      cursor: not-allowed;
      box-shadow: none;
    }

    /* Yon Panellar */
    .side-panels {
      display: flex;
      flex-direction: column;
      gap: 24px;
      width: 400px;
      max-width: 100%;
    }

    .card {
      padding: 24px;
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #f1f5f9;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .badge {
      background: rgba(56, 189, 248, 0.1);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.25);
      font-size: 0.8rem;
      padding: 4px 12px;
      border-radius: 20px;
      font-weight: 600;
    }

    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }

    input[type="text"] {
      flex: 1;
      background: rgba(15, 23, 42, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 12px 16px;
      color: white;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.3s ease;
    }

    input[type="text"]:focus {
      border-color: #a855f7;
      background: rgba(15, 23, 42, 0.7);
      box-shadow: 0 0 15px rgba(168, 85, 247, 0.2);
    }

    .btn {
      background: linear-gradient(135deg, #8b5cf6, #6366f1);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 12px 20px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3);
    }

    .btn:hover {
      opacity: 0.9;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(139, 92, 246, 0.4);
    }

    .btn:active {
      transform: translateY(0) scale(0.97);
    }

    .name-list {
      max-height: 180px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-right: 6px;
    }

    .name-list::-webkit-scrollbar, .stat-box::-webkit-scrollbar {
      width: 6px;
    }
    .name-list::-webkit-scrollbar-thumb, .stat-box::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
    }

    .name-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 23, 42, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.03);
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 0.9rem;
      transition: background 0.2s;
    }
    
    .name-item:hover {
      background: rgba(15, 23, 42, 0.6);
    }

    .delete-btn {
      color: #f43f5e;
      cursor: pointer;
      font-weight: bold;
      padding: 4px 8px;
      border-radius: 6px;
      background: rgba(244, 63, 94, 0.1);
      transition: all 0.2s;
    }

    .delete-btn:hover {
      background: rgba(244, 63, 94, 0.25);
      color: #fff;
    }

    /* Stat panellar */
    .stats-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .stat-box {
      background: rgba(15, 23, 42, 0.3);
      border-radius: 16px;
      padding: 16px;
      max-height: 200px;
      overflow-y: auto;
      border: 1px solid rgba(255, 255, 255, 0.04);
    }

    .stat-box.yodlagan {
      border-top: 4px solid #22c55e;
      background: linear-gradient(180deg, rgba(34, 197, 94, 0.05) 0%, transparent 100%);
    }

    .stat-box.yodlamagan {
      border-top: 4px solid #f43f5e;
      background: linear-gradient(180deg, rgba(244, 63, 94, 0.05) 0%, transparent 100%);
    }

    .stat-header {
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .stat-box.yodlagan .stat-header { color: #4ade80; }
    .stat-box.yodlamagan .stat-header { color: #fb7185; }

    .stat-list {
      list-style: none;
      font-size: 0.85rem;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .stat-list li {
      background: rgba(30, 41, 59, 0.4);
      padding: 6px 10px;
      border-radius: 8px;
      word-break: break-all;
      border: 1px solid rgba(255, 255, 255, 0.02);
      color: #e2e8f0;
    }

    /* Modal (Glassmorphism Modal) */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(5, 5, 10, 0.8);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: all;
    }

    .modal {
      background: rgba(20, 25, 40, 0.6);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border-radius: 30px;
      padding: 40px 30px;
      width: 90%;
      max-width: 450px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.6), inset 0 0 20px rgba(255,255,255,0.05);
      transform: scale(0.85) translate3d(0, 0, 0);
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .modal-overlay.active .modal {
      transform: scale(1) translate3d(0, 0, 0);
    }

    .modal h2 {
      color: #cbd5e1;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 10px;
    }

    .winner-name {
      font-size: 2.5rem;
      font-weight: 800;
      background: linear-gradient(135deg, #38bdf8, #818cf8, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 10px 0 30px 0;
      word-break: break-all;
      filter: drop-shadow(0 4px 10px rgba(56, 189, 248, 0.2));
    }

    .modal-actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .modal-btn {
      padding: 14px 20px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.95rem;
      transition: all 0.2s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    .modal-btn:hover {
      transform: translateY(-2px);
    }

    .modal-btn:active {
      transform: translateY(0) scale(0.98);
    }

    .btn-yodlagan {
      background: linear-gradient(135deg, #16a34a, #15803d);
      color: white;
      box-shadow: 0 8px 20px rgba(22, 163, 74, 0.3);
    }

    .btn-yodlagan:hover { box-shadow: 0 10px 25px rgba(22, 163, 74, 0.4); }

    .btn-yodlamagan {
      background: linear-gradient(135deg, #e11d48, #be123c);
      color: white;
      box-shadow: 0 8px 20px rgba(225, 29, 72, 0.3);
    }

    .btn-yodlamagan:hover { box-shadow: 0 10px 25px rgba(225, 29, 72, 0.4); }

    .btn-bekor {
      background: rgba(51, 65, 85, 0.4);
      color: #e2e8f0;
    }
    
    .btn-bekor:hover { background: rgba(51, 65, 85, 0.6); }
  </style>
</head>
<body>

  <header>
    <h1>Lug'at Topshiruvchi Barabani</h1>
    <p>Ismlarni kiriting, barabanni aylantiring va natijani belgilang!</p>
  </header>

  <div class="main-container">

    <!-- Baraban -->
    <div class="wheel-section">
      <div class="wheel-wrapper">
        <div class="pointer"></div>
        <canvas id="wheelCanvas" width="520" height="520"></canvas>
        <button id="spinBtn" class="spin-btn-center">AYLANTIR</button>
      </div>
    </div>

    <!-- Yon Boshqaruv Paneli -->
    <div class="side-panels">

      <!-- Ismlar kiritish -->
      <div class="card glass-card">
        <div class="card-title">
          Ismlar Ro'yxati
          <span id="nameCount" class="badge">0 ta ism</span>
        </div>
        <div class="input-group">
          <input type="text" id="nameInput" placeholder="Yangi ism kiriting..." onkeydown="if(event.key==='Enter') addName()">
          <button class="btn" onclick="addName()">+ Qo'shish</button>
        </div>
        <div id="nameList" class="name-list"></div>
      </div>

      <!-- Natijalar / Statistika -->
      <div class="card glass-card">
        <div class="card-title">Natijalar</div>
        <div class="stats-container">

          <div class="stat-box yodlagan">
            <div class="stat-header">
              <span>Yodlaganlar</span>
              <span id="countYodlagan">0</span>
            </div>
            <ul id="listYodlagan" class="stat-list"></ul>
          </div>

          <div class="stat-box yodlamagan">
            <div class="stat-header">
              <span>Yodlamaganlar</span>
              <span id="countYodlamagan">0</span>
            </div>
            <ul id="listYodlamagan" class="stat-list"></ul>
          </div>

        </div>
      </div>

    </div>

  </div>

  <!-- Modal Natija Oynasi -->
  <div id="resultModal" class="modal-overlay">
    <div class="modal">
      <h2>Keyingi lug'at topshiruvchisi:</h2>
      <div id="winnerDisplay" class="winner-name">...</div>

      <div class="modal-actions">
        <button class="modal-btn btn-yodlagan" onclick="handleResult('yodlagan')">
          ✅ Yodlagan (Chiqarib tashlash)
        </button>
        <button class="modal-btn btn-yodlamagan" onclick="handleResult('yodlamagan')">
          ❌ Yodlamagan (Chiqarib tashlash)
        </button>
        <button class="modal-btn btn-bekor" onclick="handleResult('bekor')">
          ↩️ Bekor qilish (Barabanda qolsin)
        </button>
      </div>
    </div>
  </div>

  <script>
    const colors = [
      '#ef4444', '#f97316', '#f59e0b', '#10b981', 
      '#06b6d4', '#3b82f6', '#8b5cf6', '#ec4899', 
      '#14b8a6', '#6366f1', '#a855f7', '#84cc16'
    ];

    let names = [];
    let yodlaganlar = [];
    let yodlamaganlar = [];

    let currentAngle = 0;
    let isSpinning = false;
    let selectedIndex = null;

    const canvas = document.getElementById('wheelCanvas');
    const ctx = canvas.getContext('2d', { alpha: true });

    // Zaif noutbuklar uchun Offscreen Off-render Cache
    const offCanvas = document.createElement('canvas');
    offCanvas.width = 520;
    offCanvas.height = 520;
    const offCtx = offCanvas.getContext('2d');

    const spinBtn = document.getElementById('spinBtn');
    const nameInput = document.getElementById('nameInput');
    const nameListEl = document.getElementById('nameList');
    const nameCountEl = document.getElementById('nameCount');
    const resultModal = document.getElementById('resultModal');
    const winnerDisplay = document.getElementById('winnerDisplay');

    // Web Audio API (Lazy / Cached) - Ovozni tabiiyroq qilish uchun chastotasi sozlandi
    let audioCtx = null;
    function playClickSound(speedFactor = 1) {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      
      // Aylanish tezligiga qarab ovoz balandligi va cho'zilishi o'zgaradi
      const freq = 300 + (speedFactor * 150); 
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.05);
      
      const volume = Math.min(0.2, 0.05 + (speedFactor * 0.15));
      gain.gain.setValueAtTime(volume, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
      
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.05);
    }

    function addName() {
      const val = nameInput.value.trim();
      if (val) {
        names.push(val);
        nameInput.value = '';
        updateUI();
      }
    }

    function removeName(index) {
      names.splice(index, 1);
      updateUI();
    }

    function updateUI() {
      nameCountEl.textContent = `${names.length} ta ism`;
      nameListEl.innerHTML = '';

      names.forEach((name, idx) => {
        const item = document.createElement('div');
        item.className = 'name-item';
        item.innerHTML = `
          <span>${name}</span>
          <span class="delete-btn" onclick="removeName(${idx})">&times;</span>
        `;
        nameListEl.appendChild(item);
      });

      renderWheelToCache();
      drawWheelFromCache();
    }

    // Barabanni Offscreen canvas'ga bir marta chizib keshlab qo'yish
    function renderWheelToCache() {
      const numSegments = names.length;
      const radius = offCanvas.width / 2;
      offCtx.clearRect(0, 0, offCanvas.width, offCanvas.height);

      if (numSegments === 0) {
        offCtx.save();
        offCtx.beginPath();
        offCtx.arc(radius, radius, radius - 15, 0, 2 * Math.PI);
        offCtx.fillStyle = 'rgba(15, 23, 42, 0.6)';
        offCtx.fill();
        offCtx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
        offCtx.lineWidth = 3;
        offCtx.stroke();

        offCtx.fillStyle = '#64748b';
        offCtx.font = '600 16px Inter, sans-serif';
        offCtx.textAlign = 'center';
        offCtx.textBaseline = 'middle';
        offCtx.fillText("Ismlar kiritilmagan", radius, radius);
        offCtx.restore();
        return;
      }

      const anglePerSegment = (2 * Math.PI) / numSegments;

      for (let i = 0; i < numSegments; i++) {
        const angle = i * anglePerSegment;

        offCtx.beginPath();
        offCtx.moveTo(radius, radius);
        offCtx.arc(radius, radius, radius - 10, angle, angle + anglePerSegment);
        offCtx.fillStyle = colors[i % colors.length];
        offCtx.fill();
        offCtx.strokeStyle = 'rgba(5, 5, 10, 0.5)';
        offCtx.lineWidth = 4;
        offCtx.stroke();

        // Matn chizish
        offCtx.save();
        offCtx.translate(radius, radius);
        offCtx.rotate(angle + anglePerSegment / 2);
        offCtx.textAlign = 'right';
        offCtx.fillStyle = '#ffffff';
        offCtx.font = '800 16px Inter, sans-serif';
        offCtx.shadowColor = 'rgba(0,0,0,0.6)';
        offCtx.shadowBlur = 6;
        offCtx.shadowOffsetX = 1;
        offCtx.shadowOffsetY = 1;

        let text = names[i];
        if (text.length > 13) text = text.substring(0, 11) + '...';

        offCtx.fillText(text, radius - 35, 6);
        offCtx.restore();
      }
    }

    // Animatsiya paytida faqat rasmni burchakka ko'ra aylantirish
    function drawWheelFromCache() {
      const radius = canvas.width / 2;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.save();
      ctx.translate(radius, radius);
      ctx.rotate(currentAngle);
      ctx.drawImage(offCanvas, -radius, -radius);
      ctx.restore();
    }

    spinBtn.addEventListener('click', spinWheel);

    function spinWheel() {
      if (isSpinning || names.length === 0) return;
      isSpinning = true;
      spinBtn.disabled = true;

      // 1. AZAM TEKSHIRUVI (Har qanday kombinatsiyani ushlaydi: aZam, Azam, AZAM...)
      const nonAzamIndices = [];
      names.forEach((n, idx) => {
        if (n.trim().toLowerCase() !== 'azam') {
          nonAzamIndices.push(idx);
        }
      });

      // Agar ro'yxatda "Azam"dan tashqari boshqa odamlar bo'lsa, FAQAT o'shalardan birini tanlaymiz
      if (nonAzamIndices.length > 0) {
        const randIdx = Math.floor(Math.random() * nonAzamIndices.length);
        selectedIndex = nonAzamIndices[randIdx];
      } else {
        // Agar ro'yxatda faqat "Azam" qolgan bo'lsa, majburan o'shani tanlaymiz
        selectedIndex = Math.floor(Math.random() * names.length);
      }

      const numSegments = names.length;
      const anglePerSegment = (2 * Math.PI) / numSegments;

      // Yutgan ismni markaziy strelkada to'xtatish burchagi
      const targetSegmentAngle = 1.5 * Math.PI - (selectedIndex + 0.5) * anglePerSegment;
      
      // 2. REALLASHTIRILGAN AYLANISH FIZIKASI
      // Baraban ko'proq aylanadi va sekinlashish uzoqroq davom etadi
      const fullRotations = 10 + Math.floor(Math.random() * 5); // 10-14 marta aylanish
      const finalAngle = fullRotations * 2 * Math.PI + targetSegmentAngle;

      const startAngle = currentAngle % (2 * Math.PI);
      const totalRotation = finalAngle - startAngle;

      // Aylanish davomiyligini biroz uzaytiramiz (Fizik inertsiya effekti, 7-8.5 soniya)
      const duration = 7000 + Math.random() * 1500; 
      const startTime = performance.now();
      let lastSoundSegment = -1;

      function animate(now) {
        const elapsed = now - startTime;
        let progress = Math.min(elapsed / duration, 1);

        // Quintic Ease-Out formulasi - boshida juda tez, oxirida o'ta sekin, haqiqiy baraban kabi to'xtaydi
        const easeOut = 1 - Math.pow(1 - progress, 5);

        currentAngle = startAngle + totalRotation * easeOut;
        drawWheelFromCache();

        // Ovoz berish logikasi (tezlikka qarab ovoz ohangi o'zgaradi)
        const currentSegment = Math.floor((((1.5 * Math.PI - currentAngle) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI)) / anglePerSegment);
        if (currentSegment !== lastSoundSegment) {
          const speedFactor = 1 - progress; // 1 dan 0 ga qarab pasayadi
          playClickSound(speedFactor);
          lastSoundSegment = currentSegment;
        }

        if (progress < 1) {
          requestAnimationFrame(animate);
        } else {
          isSpinning = false;
          spinBtn.disabled = false;
          showResult(names[selectedIndex]);
        }
      }

      requestAnimationFrame(animate);
    }

    function showResult(winner) {
      winnerDisplay.textContent = winner;
      resultModal.classList.add('active');

      confetti({
        particleCount: 120,
        spread: 80,
        origin: { y: 0.55 },
        colors: ['#38bdf8', '#818cf8', '#c084fc', '#f472b6'],
        disableForReducedMotion: true
      });
    }

    function handleResult(action) {
      if (selectedIndex === null) return;
      const winnerName = names[selectedIndex];

      if (action === 'yodlagan') {
        yodlaganlar.push(winnerName);
        names.splice(selectedIndex, 1);
      } else if (action === 'yodlamagan') {
        yodlamaganlar.push(winnerName);
        names.splice(selectedIndex, 1);
      }

      resultModal.classList.remove('active');
      selectedIndex = null;

      updateStatsUI();
      updateUI();
    }

    function updateStatsUI() {
      document.getElementById('countYodlagan').textContent = yodlaganlar.length;
      const listYod = document.getElementById('listYodlagan');
      listYod.innerHTML = '';
      yodlaganlar.forEach(n => {
        const li = document.createElement('li');
        li.textContent = n;
        listYod.appendChild(li);
      });

      document.getElementById('countYodlamagan').textContent = yodlamaganlar.length;
      const listYodla = document.getElementById('listYodlamagan');
      listYodla.innerHTML = '';
      yodlamaganlar.forEach(n => {
        const li = document.createElement('li');
        li.textContent = n;
        listYodla.appendChild(li);
      });
    }

    updateUI();
  </script>
</body>
</html>
